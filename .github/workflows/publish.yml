name: publish

# Builds the lists and publishes them to S3 + CloudFront.
# Runs nightly, or by hand from the Actions tab ("Run workflow").
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      new_history:
        description: Start the data, backfilling every night back to Dec 2019 from Steven Lu's lists (first run only)
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # sign in to AWS with OIDC, no stored AWS keys

concurrency:
  group: publish
  cancel-in-progress: false

env:
  SITE_URL: https://movies.mickschroeder.com

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Fails without writing anything if any list doesn't pass its checks,
      # so the live site keeps yesterday's files.
      - name: Build data
        run: pnpm build:data ${{ inputs.new_history && '--new-history' || '' }}
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
          MDBLIST_KEY: ${{ secrets.MDBLIST_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Optional: unset uses the default in pipeline/config.ts
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}

      - name: Build site
        run: pnpm build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      # No --delete: earlier nights' best-pictures-YYYYMMDD.json files stay in the bucket.
      # Astro's hashed assets never change, so they cache for a year.
      - name: Upload to S3
        run: |
          aws s3 sync dist/_astro/ "s3://${{ vars.AWS_BUCKET }}/_astro/" --cache-control "public, max-age=31536000, immutable" --no-progress
          aws s3 sync dist/ "s3://${{ vars.AWS_BUCKET }}/" --exclude "_astro/*" --cache-control "public, max-age=3600" --no-progress

      - name: Refresh CloudFront cache
        run: |
          id=$(aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*" --query Invalidation.Id --output text)
          aws cloudfront wait invalidation-completed \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --id "$id"

      - name: Check the live site matches this build
        run: |
          for file in best-pictures.json "best-pictures-$(date -u +%Y%m%d).json" data/rankings.json; do
            curl -fsS --compressed "$SITE_URL/$file" -o live.json
            if ! cmp -s live.json "dist/$file"; then
              echo "::error::$SITE_URL/$file does not match this build"
              exit 1
            fi
            echo "$file OK"
          done

      # Copies the live best-pictures.json and year files to the lists in pipeline/lists.json.
      # Last, so a failure here never holds back the site.
      - name: Sync lists
        run: pnpm sync:lists
        env:
          MDBLIST_KEY: ${{ secrets.MDBLIST_KEY }}
          TMDB_LIST_TOKEN: ${{ secrets.TMDB_LIST_TOKEN }}
